<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bible Passage Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Tippy.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
</head>
<body>
    <h1>Bible Passage Viewer</h1>
    <form method="post">
        <label>
            Passage: <input type="text" name="passage" value="{{ passage }}" placeholder="e.g. Jn 3:16">
        </label>
        <br>
        <label>
            Module:
            <select name="module">
                {% for mod in available_modules %}
                <option value="{{ mod }}" {% if mod == module %}selected{% endif %}>{{ mod }}</option>
                {% endfor %}
            </select>
        </label>
        <br>
        <label>
            Keyword (optional): <input type="text" name="keyword" value="{{ keyword }}" placeholder="e.g. God">
        </label>
        <br>
        <input type="submit" value="Get Passage">
    </form>
    <h2>Passage Text</h2>
    <div id="passage-container">
        {{ passage_text | safe }}
    </div>
    {% if search_results %}
    <h2>Search Results</h2>
    <ul>
        {% for line in search_results %}
        <li>{{ line | safe }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <!-- Include Tippy.js and Popper.js -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="{{ url_for('static', filename='tooltip.js') }}"></script>
</body>
</html>
