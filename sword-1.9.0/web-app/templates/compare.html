<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bible Passage Viewer - Compare Versions</title>

  <!-- Google Fonts for Charis SIL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  >

  <!-- Tippy.js CSS (tooltips) -->
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />

  <!-- Your own CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="top-bar">
    <h1>Bible Passage Viewer - Compare Versions</h1>
  </header>

  <main class="main-content">
    <form method="post" class="passage-form">
      <label>Book:
        <select name="book">
          {% for book in bible_books %}
            <option value="{{ book }}" {% if book == selected_book %}selected{% endif %}>
              {{ book }}
            </option>
          {% endfor %}
        </select>
      </label>

      <label>Passage (Chapter:Verse):
        <input type="text" name="passage" value="{{ passage_input }}" placeholder="e.g. 1:1-5">
      </label>

      <label>Module Version 1:
        <select name="module1">
          {% for mod in available_modules %}
            <option value="{{ mod }}" {% if mod == module1 %}selected{% endif %}>
              {{ mod }}
            </option>
          {% endfor %}
        </select>
      </label>

      <label>Module Version 2:
        <select name="module2">
          {% for mod in available_modules %}
            <option value="{{ mod }}" {% if mod == module2 %}selected{% endif %}>
              {{ mod }}
            </option>
          {% endfor %}
        </select>
      </label>

      <button type="submit">Get Passage</button>
    </form>

    <!-- Only show comparison windows if both passages are available -->
    {% if passage_text1 and passage_text2 %}
      <div class="compare-container">
        <!-- First Bible Window -->
        <div class="bible-window">
          <div class="book-heading">
            <h2>{{ selected_book }} {{ passage_input }} - {{ module1 }}</h2>
          </div>
          <div class="bible-text" id="bible-text-1">
            {{ passage_text1 | safe }}
          </div>
        </div>

        <!-- Second Bible Window -->
        <div class="bible-window">
          <div class="book-heading">
            <h2>{{ selected_book }} {{ passage_input }} - {{ module2 }}</h2>
          </div>
          <div class="bible-text" id="bible-text-2">
            {{ passage_text2 | safe }}
          </div>
        </div>
      </div>
    {% endif %}
  </main>

  <!-- Popper.js and Tippy.js -->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>

  <!-- Dictionary JS (optional) -->
  <script src="{{ url_for('static', filename='js/strongs-greek-dictionary.js') }}"></script>
  <script src="{{ url_for('static', filename='js/strongs-hebrew-dictionary.js') }}"></script>

  <!-- Tooltip logic -->
  <script src="{{ url_for('static', filename='tooltip.js') }}"></script>
</body>
</html>
