<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bible Passage Viewer</title>
  <!-- Google Fonts for Charis SIL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  >
  <!-- Tippy.js CSS (tooltips) -->
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
  <!-- Your own CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="top-bar">
    <h1>Bible Passage Viewer</h1>
  </header>
  <main class="main-content">
    <!-- Form for selecting a passage -->
    <form method="post" class="passage-form">
      <label>Book:
        <select name="book">
          {% for book in bible_books %}
            <option value="{{ book }}" {% if book == selected_book %}selected{% endif %}>
              {{ book }}
            </option>
          {% endfor %}
        </select>
      </label>
      <label>Passage (Chapter:Verse):
        <input type="text" name="passage" value="{{ passage_input }}" placeholder="e.g., 1:1-5">
      </label>
      <label>Module:
        <select name="module">
          {% for mod in available_modules %}
            <option value="{{ mod }}" {% if mod == module %}selected{% endif %}>
              {{ mod }}
            </option>
          {% endfor %}
        </select>
      </label>
      <button type="submit">Get Passage</button>
    </form>

    <!-- Display Book Heading if verses were retrieved -->
    {% if passage_dict %}
      <div class="book-heading">
        <h2>{{ selected_book }} {{ passage_input }}</h2>
      </div>
      <!-- Display the verses as a list -->
      <div class="bible-text" id="bible-text">
        <ul>
          {% for verse_ref, verse_content in passage_dict.items() %}
          <p>
            <sup style="font-size: 0.8em; font-weight: bold;">{{ verse_ref.split(":")[-1] }}</sup>
            <span>{{ verse_content | safe }}</span>
          </p>
        {% endfor %}
        
        </ul>
      </div>
    {% endif %}
  </main>
  <!-- Popper.js and Tippy.js from CDNs -->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <!-- Optional: Dictionary data for tooltips -->
  <script src="{{ url_for('static', filename='js/strongs-greek-dictionary.js') }}"></script>
  <script src="{{ url_for('static', filename='js/strongs-hebrew-dictionary.js') }}"></script>
  <!-- Tooltip logic -->
  <script src="{{ url_for('static', filename='tooltip.js') }}"></script>
</body>
</html>
